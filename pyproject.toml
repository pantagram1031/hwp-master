[project]
name = "hwp-master"
version = "0.6.0"
description = "Deterministic HWP/HWPX inspection, assembly, typesetting, and proof tools"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyMuPDF>=1.23", "Pillow>=10"]

[project.optional-dependencies]
windows = ["pyhwpx", "pywin32"]
test = ["pytest>=8"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
